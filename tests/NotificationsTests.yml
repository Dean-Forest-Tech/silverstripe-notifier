DFT\SilverStripe\Notifier\Model\Notification:
  create:
    BaseClassName: DFT\SilverStripe\Notifier\Tests\Objects\TestCreateObject
    StateCreated: true
  update:
    BaseClassName: DFT\SilverStripe\Notifier\Tests\Objects\TestUpdateObject
    StateUpdated: true
  updaterules_namechanged:
    BaseClassName: DFT\SilverStripe\Notifier\Tests\Objects\TestChangeNameObject
  updaterules_statuspaid:
    BaseClassName: DFT\SilverStripe\Notifier\Tests\Objects\TestStatusPaidObject
  subject:
    BaseClassName: DFT\SilverStripe\Notifier\Tests\Objects\TestSubjectObject
  delete:
    BaseClassName: DFT\SilverStripe\Notifier\Tests\Objects\TestDeleteObject
    StateDeleted: true

DFT\SilverStripe\Notifier\Types\EmailNotification:
  created:
    From: 'sender@dean-forest-tech.uk'
    Recipient: 'recipient@dean-forest-tech.uk'
    Subject: 'Created Subject'
    Notification: =>DFT\SilverStripe\Notifier\Model\Notification.create
  updated:
    From: 'sender@dean-forest-tech.uk'
    Recipient: 'recipient@dean-forest-tech.uk'
    Subject: 'Updated Subject'
    Notification: =>DFT\SilverStripe\Notifier\Model\Notification.update
  updaterules_namechanged:
    From: 'sender@dean-forest-tech.uk'
    Recipient: 'recipient@dean-forest-tech.uk'
    Subject: 'Updated Name'
    Notification: =>DFT\SilverStripe\Notifier\Model\Notification.updaterules_namechanged
  updaterules_statuspaid:
    From: 'sender@dean-forest-tech.uk'
    Recipient: 'recipient@dean-forest-tech.uk'
    Subject: 'Updated To Status Paid'
    Notification: =>DFT\SilverStripe\Notifier\Model\Notification.updaterules_statuspaid
  subject:
    From: 'sender@dean-forest-tech.uk'
    Recipient: 'recipient@dean-forest-tech.uk'
    Subject: 'Field Changed To {$Name}'
    Notification: =>DFT\SilverStripe\Notifier\Model\Notification.subject
  deleted:
    From: 'sender@dean-forest-tech.uk'
    Recipient: 'recipient@dean-forest-tech.uk'
    Subject: 'Deleted Subject'
    Notification: =>DFT\SilverStripe\Notifier\Model\Notification.delete

DFT\SilverStripe\Notifier\Model\NotificationRule:
  namechanged:
    FieldName: Name
    WasChanged: true
    Notification: =>DFT\SilverStripe\Notifier\Model\Notification.updaterules_namechanged
  namechanged_two:
    FieldName: Name
    WasChanged: true
    Notification: =>DFT\SilverStripe\Notifier\Model\Notification.subject
  statuspaid:
    FieldName: Status
    Value: paid
    Notification: =>DFT\SilverStripe\Notifier\Model\Notification.updaterules_statuspaid